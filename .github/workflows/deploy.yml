name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (vars.ENABLE_AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Execute commands on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          SERVER_FOLDER: ${{ secrets.SERVER_FOLDER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVER_FOLDER,DEPLOY_SHA
          script: |
            set -eu
            cd "$SERVER_FOLDER"
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"
            docker compose config --quiet
            docker compose build --pull
            docker compose up -d --wait --wait-timeout 90
